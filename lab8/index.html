<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="header">
            <h1 class="logo">My Site</h1>

            <button class="burger" id="burger">☰</button>

            <nav class="nav" id="nav">
                <a href="#">Головна</a>
                <a href="#">Про нас</a>
                <a href="#">Послуги</a>
                <a href="#">Контакти</a>
            </nav>
        </header>

        <section class="carousel">
            <div class="slides" id="slides">
               <img src="https://placehold.co/800x400?text=Slide+1">
               <img src="https://placehold.co/800x400?text=Slide+2">
               <img src="https://placehold.co/800x400?text=Slide+3"> 
            </div>

            <button class="prev" id="prev">←</button>
            <button class="next" id="next">→</button>

            <div class="dots">
               <span class="dot" data-index="0"></span>
               <span class="dot" data-index="1"></span>
               <span class="dot" data-index="2"></span> 
            </div>
        </section>

        <section class="large">
            <h2>Для комп’ютера</h2>
               <img src="https://placehold.co/300x200?text=Large+1">
               <img src="https://placehold.co/300x200?text=Large+2">
               <img src="https://placehold.co/300x200?text=Large+3">
        </section>

        <section class="medium">
            <h2>Для телефону</h2>
               <img src="https://placehold.co/300x200?text=Mobile+1">
               <img src="https://placehold.co/300x200?text=Mobile+2">
               <img src="https://placehold.co/300x200?text=Mobile+3">
        </section>

        <script src="script.js"></script>
    </body>
</html>
